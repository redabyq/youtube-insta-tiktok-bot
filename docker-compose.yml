# Direct mode. Use python compose.py to select mode from .env.
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: dl_tg_api
    restart: unless-stopped
    env_file: .env
    environment:
      TELEGRAM_LOCAL: 'true'
      TELEGRAM_HTTP_IP_ADDRESS: 0.0.0.0
      TELEGRAM_HTTP_PORT: '8081'
    volumes:
      - tg_api_data:/var/lib/telegram-bot-api
    networks: [dlnet]
  bot:
    build: ./bot
    container_name: dl_bot
    restart: unless-stopped
    env_file: .env
    environment:
      PROXY_ENABLED: '0'
      LOCAL_BOT_API_URL: http://telegram-bot-api:8081
    volumes:
      - ./cookies:/cookies:ro
    depends_on:
      telegram-bot-api:
        condition: service_started
    networks: [dlnet]
volumes:
  tg_api_data:
networks:
  dlnet:
    driver: bridge
